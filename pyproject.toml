[project]
name = "puls-wyborczy"
version = "0.1.0"
description = "Agregator sondazy wyborczych: model przestrzeni stanow z efektami pracowni i skalibrowana niepewnoscia"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Krzysztof Pika", email = "takzen.app@gmail.com" },
]
requires-python = ">=3.13"
dependencies = [
    "requests>=2.34.2",
    "pandas>=3.0.0",
    "pyarrow>=25.0.0",
    "scipy>=1.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
]
# Local review dashboard only; the published pipeline produces JSON and needs neither.
dashboard = [
    "streamlit>=1.63.0",
    "plotly>=7.0.0",
]

[build-system]
requires = ["setuptools>=78.0.0"]
build-backend = "setuptools.build_meta"
